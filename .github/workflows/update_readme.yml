name: Update README with Latest Activity

on:
  schedule:
    # Runs every day at 06:00 UTC (adjust cron as needed)
    - cron: "0 6 * * *"
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: write # Required to commit and push changes back to the repo

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script to update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python .github/scripts/script.py

      - name: Commit and push if README changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update README with recent activity"
          git push
